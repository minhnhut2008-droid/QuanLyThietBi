 if(validCfg(c)){cfgNote='drive-config.js trên máy chủ đang trống hoặc bị ghi đè; app dùng cấu hình đã lưu trên máy này.';return c}

let KEY=null,SALT='',afterKey=null,needCreate=false;

const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('qltb',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbPut=async(k,v)=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})};
const idbGet=async k=>{const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('k').objectStore('k').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};

async function loadLocal(){try{const c=localStorage.getItem('gn_v3');if(!c)return;const x=await decObj(JSON.parse(c));S={...S,...x.S};Q=x.Q||[];derive()}catch(e){}}

async function resetStore(){if(!admin||!tok)return alert('Cần đăng nhập Google (có mạng) bằng tài khoản admin.');
 if(!confirm('ĐẶT LẠI KHO DỮ LIỆU?\nToàn bộ thiết bị, cán bộ và nhật ký giao nhận trên Drive sẽ bị XÓA. Không thể hoàn tác.'))return;if(prompt('Gõ XOA để xác nhận:')!=='XOA')return;
 try{for(const [fid] of FILES())await dapi('https://www.googleapis.com/upload/drive/v3/files/'+fid+'?uploadType=media',{method:'PATCH',headers:J,body:'{}'});
  ['gn_v3','gn_salt'].forEach(k=>localStorage.removeItem(k));KEY=null;SALT='';S={devices:{},staff:{},transfers:{},holders:{},requests:{}};Q=[];derive();lastMod={};needCreate=true;try{await idbDel('k')}catch(e){}
  afterKey=()=>{hideGate();render();sync1()};askKey('Đã đặt lại. Hãy tạo mật khẩu mã hóa mới.')}catch(e){alert('Không đặt lại được: '+e.message)}}
async function tryKey(){const p=document.getElementById('k_pw').value,mk=needCreate&&admin;if(!p)return;
 if(mk){if(p.length<8)return askKey('Mật khẩu tối thiểu 8 ký tự');if(p!==document.getElementById('k_pw2').value)return askKey('Hai mật khẩu không khớp')}

async function changeKey(){const p=prompt('Mật khẩu mã hóa MỚI (từ 8 ký tự):');if(!p)return;if(p.length<8)return alert('Tối thiểu 8 ký tự');if(prompt('Nhập lại mật khẩu mới:')!==p)return alert('Hai mật khẩu không khớp');

  lastMod={};persist();alert('Đã đổi mật khẩu. Các cán bộ khác sẽ được yêu cầu nhập mật khẩu mới.')}catch(e){alert('Đổi mật khẩu thất bại: '+e.message)}}

const gv=k=>document.getElementById(k).value.trim(),LOGO='<h1 class="text-xl font-bold text-blue-900 mb-1">★ Quản Lý Thiết Bị</h1>';
function showLogin(msg){showGate(LOGO+`<p class="text-sm text-slate-500 mb-4">Đăng nhập bằng tài khoản Google (Gmail) để dùng chung dữ liệu lưu trên Google Drive.</p>${msg?`<p class="text-sm text-red-600 mb-3">${E(msg)}</p>`:''}<button class="btn bg-blue-800 text-white w-full" onclick="signIn()">Đăng nhập bằng Google</button>`)}

let authing=false,renewing=false;
function mkTc(){return tc=tc||google.accounts.oauth2.initTokenClient({client_id:CFG.clientId,scope:'openid email profile https://www.googleapis.com/auth/drive'+(CFG.picker===false?'':'.file'),callback:onTokResp,error_callback:()=>{authing=false;renewing=false;sync()}})}
function onTokResp(r){authing=false;if(r.error){if(renewing){renewing=false;sync();return}return showLogin('Không đăng nhập được: '+r.error)}

let pickTried=false;

async function mkStore(){try{const mk=async n=>{const f=await dapi(DRV.slice(0,-1),{method:'POST',headers:J,body:JSON.stringify({name:n,mimeType:'application/json'})});

function logout(){if(Q.length&&!confirm('Còn '+Q.length+' thay đổi chưa gửi lên Drive. Đăng xuất sẽ làm mất. Tiếp tục?'))return;
 try{['gn_v2','gn_v3','gn_salt','gn_admin','gn_prof'].forEach(k=>localStorage.removeItem(k))}catch(e){}KEY=null;idbDel('k').catch(()=>{});S={devices:{},staff:{},transfers:{},holders:{},requests:{}};Q=[];derive();
 if(tok&&window.google)google.accounts.oauth2.revoke(tok);tok='';me=null;prof=null;admin=false;live=false;showLogin();render()}
async function sync1(){if(busy||!CFG||!tok||!KEY||Date.now()>tokExp||!navigator.onLine)return;busy=true;const before=JSON.stringify(S);
 try{for(const [fid,cols] of FILES()){
   const meta=await dapi(DRV+fid+'?fields=modifiedTime,capabilities(canEdit)');
   if(cols[0]==='devices'){const a=!!(meta.capabilities&&meta.capabilities.canEdit);if(a!==admin){admin=a;try{localStorage.setItem('gn_admin',a?'1':'0')}catch(e){}render()}}
   const mine=Q.filter(q=>cols.includes(q.c));
   if(meta.modifiedTime===lastMod[fid]&&!mine.length&&live)continue;
   const rem=await decObj(await dapi(DRV+fid+'?alt=media'));let dirty=false,done=[];
   mine.forEach(q=>{const m=rem[q.c]||(rem[q.c]={}),k=key(q.id);
    if(q.op==='set'){if(JSON.stringify(m[k])===JSON.stringify(q.data))done.push(q);else{m[k]=JSON.parse(JSON.stringify(q.data));dirty=true}}
    else if(k in m){delete m[k];dirty=true}else done.push(q)});
   if(dirty){try{await dapi('https://www.googleapis.com/upload/drive/v3/files/'+fid+'?uploadType=media',{method:'PATCH',headers:J,body:JSON.stringify(await encObj(rem))});setTimeout(sync1,3000)}
    catch(e){if(e.status===403){Q=Q.filter(q=>!mine.includes(q));lastMod[fid]='';setTimeout(sync1,300);alert('Bạn không có quyền ghi vào danh mục này. Thay đổi đã bị hủy.');continue}else throw e}}
   Q=Q.filter(q=>!done.includes(q));cols.forEach(c=>{S[c]=rem[c]||{};got[c]=1});
   const m2=await dapi(DRV+fid+'?fields=modifiedTime');lastMod[fid]=dirty?'':m2.modifiedTime}
  live=true}catch(e){live=false;if(e.message==='BADKEY'){KEY=null;SALT='';lastMod={};['gn_salt','gn_v3'].forEach(k=>localStorage.removeItem(k));idbDel('k').catch(()=>{});afterKey=()=>{hideGate();render();sync()};askKey('Mật khẩu mã hóa đã thay đổi hoặc không khớp. Nhập lại.')}}
 busy=false;if(JSON.stringify(S)!==before){derive();persist();render()}else persist();sync();checkConfirm()}
function startCloud(){const C=cfgResolve();if(!C){noCloud=true;admin=true;return sync()}
 CFG={...C,deviceId:idOf(C.deviceFile),staffId:idOf(C.staffFile),logId:idOf(C.logFile)};setInterval(autoRenew,60000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')autoRenew()});document.addEventListener('click',()=>{if(needAuth())renew(false)},true);let c=null;try{c=JSON.parse(localStorage.getItem('gn_prof'))}catch(e){}
 if(c&&c.me){me=c.me;prof=c.prof;admin=localStorage.getItem('gn_admin')==='1';SALT=localStorage.getItem('gn_salt')||'';const go=()=>{hideGate();render();sync()};afterKey=go;
  idbGet('k').then(async k=>{if(k&&SALT){KEY=k;await loadLocal();go()}else askKey()}).catch(()=>askKey())}else showLogin()}

 const t={id:'PGN'+String(now).slice(-6),deviceId:id,from:d.holder,to,time:now,doneAt:now,note:n||'Trả lại thiết bị',status:'Đã hoàn tất',kind:'return'};
 closeM();put('transfers',t);put('holders',{id:id,holder:to})}

function qr(code){let h=0,s='';for(const c of code)h=(h*31+c.charCodeAt(0))>>>0;const n=9;let r='';
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){h=(h*1103515245+12345)>>>0;const f=(x<3&&y<3)||(x>5&&y<3)||(x<3&&y>5);if(f||(h>>16)&1)r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
 return `<svg viewBox="0 0 9 9" class="w-10 h-10 shrink-0" fill="#1e3a8a">${r}</svg>`}

 {const sid=db.staffObjs[i].id;ask('Xóa cán bộ '+s+'? Lịch sử giao nhận cũ vẫn được giữ.',()=>{rm('staff',sid);if(jf.who===s)jf.who=''},'Xóa')}}

function transfers(){const cards=[...db.transfers].reverse().map(t=>`<div class="bg-white rounded-xl shadow-sm p-3"><div class="flex justify-between gap-2"><b>${E(dev(t.deviceId).name)}</b>${badge(t.status)}</div><div class="text-sm text-slate-500">${E(t.from)} → ${E(t.to)}<br>${fmt(t.time)}</div><div class="mt-2 flex flex-wrap gap-2">${t.status==='Chờ xác nhận'?`<button class="btn bg-blue-800 text-white flex-1" onclick="zalo('${t.id}')">Hiện mã QR xác nhận</button>`:''}${t.status==='Đã hoàn tất'&&dev(t.deviceId).holder===t.to?`<button class="btn bg-violet-100 text-violet-800 flex-1" onclick="retForm('${t.deviceId}')">Trả lại</button>`:''}<button class="btn bg-slate-100 flex-1" onclick="pdfOne('${t.id}')">Xuất PDF</button>${admin?`<button class="btn bg-red-50 text-red-700 flex-1" onclick="delTr('${t.id}')">Xóa</button>`:''}</div></div>`).join('')||'<p class="text-slate-500">Chưa có phiếu.</p>';
 return `<div class="flex flex-wrap justify-between items-center gap-2 mb-3"><h1 class="text-xl font-bold">Phiếu giao nhận</h1><div class="flex gap-2">${admin?'<button class="btn bg-red-50 text-red-700" onclick="resetLog()">Làm mới nhật ký</button>':''}<button class="btn bg-blue-800 text-white" onclick="trForm()">+ Tạo phiếu</button></div></div><div class="grid md:grid-cols-2 gap-3">${cards}</div>`}
function delTr(id){if(!admin)return;if(confirm('Xóa phiếu này khỏi nhật ký? Không thể hoàn tác. (Người đang giữ thiết bị không bị thay đổi.)'))rm('transfers',id)}
function resetLog(){if(!admin)return;const n=db.transfers.length;if(!n)return alert('Nhật ký đang trống.');
 if(!confirm('Xóa toàn bộ '+n+' phiếu giao nhận? Không thể hoàn tác.'))return;
 const back=confirm('Đồng thời đưa TẤT CẢ thiết bị về Kho?\nOK = đưa về Kho, Hủy = giữ nguyên người đang giữ.');
 db.transfers.forEach(t=>{delete S.transfers[key(t.id)];Q.push({op:'del',c:'transfers',id:t.id})});
 if(back)db.devices.forEach(d=>{if(d.holder!=='Kho'){const o={id:d.id,holder:'Kho'};S.holders[key(d.id)]=o;Q.push({op:'set',c:'holders',id:d.id,data:o})}});
 changed()}
function trForm(){const opt=a=>a.map(x=>`<option>${E(x)}</option>`).join('');
 modal(`<h2 class="font-bold text-lg mb-3">Tạo phiếu giao nhận</h2>
 <label class="block mb-3 text-sm font-semibold">Thiết bị<select id="t_dev" class="inp mt-1 font-normal" onchange="document.getElementById('t_from').value=dev(this.value).holder||'Kho'">${db.devices.map(d=>`<option value="${d.id}">${E(d.id)} - ${E(d.name)}</option>`).join('')}</select></label>
 <label class="block mb-3 text-sm font-semibold">Cán bộ giao<select id="t_from" class="inp mt-1 font-normal"><option>Kho</option>${opt(db.staff)}</select></label>
 <label class="block mb-3 text-sm font-semibold">Cán bộ nhận<select id="t_to" class="inp mt-1 font-normal">${opt(db.staff)}<option>Kho</option></select></label>
 <label class="block mb-3 text-sm font-semibold">Thời gian giao<input class="inp mt-1 font-normal bg-slate-50" readonly value="${fmt(Date.now())}"></label>
 <div class="mb-4 text-sm font-semibold">Ghi chú tình trạng<div class="mt-2 font-normal">${chips('t_note')}</div><textarea id="t_note" rows="3" class="inp font-normal" placeholder="Chọn gợi ý phía trên hoặc tự nhập…"></textarea></div>
 <div class="flex gap-2"><button class="btn bg-slate-100 flex-1" onclick="closeM()">Hủy</button><button class="btn bg-blue-800 text-white flex-1" onclick="saveTr()">Tạo phiếu</button></div>`);
 document.getElementById('t_from').value=dev(db.devices[0]?.id).holder||'Kho'}
function saveTr(){const g=k=>document.getElementById(k).value;if(!g('t_dev'))return alert('Chưa có thiết bị');if(g('t_from')===g('t_to'))return alert('Bên giao và bên nhận phải khác nhau');
 const t={id:'PGN'+Date.now().toString().slice(-6),deviceId:g('t_dev'),from:g('t_from'),to:g('t_to'),time:Date.now(),note:g('t_note'),status:'Chờ xác nhận',token:Math.random().toString(36).slice(2,12)};
 put('transfers',t);zalo(t.id)}
function zalo(id){const t=db.transfers.find(x=>x.id===id),link=base()+'?c='+t.id+'.'+t.token;
 modal(`<h2 class="font-bold text-lg mb-2">Mã QR xác nhận giao nhận</h2><p class="text-sm text-slate-500 mb-3">Người nhận <b>${E(t.to)}</b> đăng nhập app rồi quét mã bằng camera điện thoại để xác nhận. Hệ thống ghi lại tài khoản của người quét.</p><div id="qrbox" class="flex justify-center mb-3"></div><div class="text-xs break-all text-blue-700 mb-3">${link}</div><div class="flex gap-2 flex-col sm:flex-row"><button class="btn bg-slate-100 flex-1" onclick="navigator.clipboard&&navigator.clipboard.writeText('${link}');alert('Đã sao chép liên kết')">Sao chép liên kết</button>${t.status==='Chờ xác nhận'&&admin?`<button class="btn bg-emerald-600 text-white flex-1" onclick="confirmTr('${t.id}')">Admin xác nhận thay</button>`:''}<button class="btn bg-blue-800 text-white flex-1" onclick="closeM();render()">Đóng</button></div>`);
 if(window.QRCode)new QRCode(document.getElementById('qrbox'),{text:link,width:200,height:200});render()}
function checkConfirm(){if(!pc||pcShown||!got.transfers)return;const t=db.transfers.find(x=>x.id===pc.id);pcShown=true;history.replaceState(null,'',base());
 if(!t)return alert('Không tìm thấy phiếu giao nhận.');if(t.token!==pc.tk)return alert('Mã QR không hợp lệ.');if(t.status!=='Chờ xác nhận')return alert('Phiếu này đã được xác nhận trước đó.');
 const d=dev(t.deviceId);modal(`<h2 class="font-bold text-lg mb-3">Xác nhận nhận thiết bị</h2><p class="text-sm mb-3"><b>${E(d.name)}</b> (${E(d.serial)})<br>${E(t.from)} → <b>${E(t.to)}</b><br>${fmt(t.time)}<br>Ghi chú: ${E(t.note)||'-'}</p><p class="text-xs text-slate-500 mb-3">Bạn đang đăng nhập: <b>${E(prof&&prof.name)}</b> ${E(prof&&(prof.phone||prof.email))}</p><div class="flex gap-2"><button class="btn bg-slate-100 flex-1" onclick="closeM()">Hủy</button><button class="btn bg-emerald-600 text-white flex-1" onclick="confirmTr('${t.id}')">Tôi xác nhận đã nhận</button></div>`)}
function confirmTr(id){const t={...db.transfers.find(x=>x.id===id),status:'Đã hoàn tất',doneAt:Date.now(),confirmBy:me?{uid:me.uid,name:(prof&&prof.name)||'',phone:(prof&&prof.phone)||'',email:me.email||''}:null},d0=db.devices.find(x=>x.id===t.deviceId),d=d0&&{...d0};
 closeM();put('transfers',t);if(d)put('holders',{id:d.id,holder:t.to})}
let jf={from:'',to:'',who:''};
function jList(){return db.transfers.filter(t=>(!jf.from||t.time>=new Date(jf.from).getTime())&&(!jf.to||t.time<=new Date(jf.to).getTime()+864e5-1)&&(!jf.who||t.from===jf.who||t.to===jf.who))}
function journal(){const L=ordered(jList());
 const rows=L.map(t=>`<tr class="border-t"><td class="p-3">${fmt(t.time)}</td><td class="p-3">${E(dev(t.deviceId).name)}</td><td class="p-3">${E(t.from)}</td><td class="p-3">${E(t.to)}</td><td class="p-3">${E(t.note)}</td><td class="p-3">${badge(t.status)}</td></tr>`).join('');
 const cards=L.map(t=>`<div class="bg-white rounded-xl shadow-sm p-3 text-sm"><div class="flex justify-between"><b>${E(dev(t.deviceId).name)}</b>${badge(t.status)}</div>${E(t.from)} → ${E(t.to)}<div class="text-slate-500">${fmt(t.time)}</div></div>`).join('');
 return `<h1 class="text-xl font-bold mb-3">Nhật ký giao nhận</h1><div class="grid grid-cols-1 sm:grid-cols-3 lg:grid-cols-5 gap-2 mb-3">
 <input type="date" class="inp" value="${jf.from}" onchange="jf.from=this.value;render()"><input type="date" class="inp" value="${jf.to}" onchange="jf.to=this.value;render()">
 <select class="inp" onchange="jf.who=this.value;render()"><option value="">Tất cả cá nhân</option>${db.staff.map(s=>`<option ${s===jf.who?'selected':''}>${E(s)}</option>`).join('')}</select>${sortSel()}<button class="btn bg-blue-800 text-white" onclick="pdfLog()">Xuất sổ nhật ký PDF</button></div>
 <div class="md:hidden space-y-3">${cards}</div><div class="hidden md:block bg-white rounded-xl shadow-sm overflow-x-auto"><table class="w-full text-left text-sm"><thead class="bg-blue-50 text-blue-900"><tr><th class="p-3">Thời gian</th><th class="p-3">Thiết bị</th><th class="p-3">Bên giao</th><th class="p-3">Bên nhận</th><th class="p-3">Ghi chú</th><th class="p-3">Trạng thái</th></tr></thead><tbody>${rows}</tbody></table></div>`}
const HEAD='<div style="text-align:center;font-weight:bold">CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM<br><u>Độc lập - Tự do - Hạnh phúc</u></div>';
const TBL='style="width:100%;border-collapse:collapse;font-size:13px"',TD='style="border:1px solid #000;padding:5px"';
function printFallback(x){const w=window.open('','_blank');if(!w)return alert('Không tạo được PDF. Hãy cho phép cửa sổ bật lên rồi thử lại.');
 w.document.write('<!doctype html><meta charset="utf-8"><title>Biên bản</title><body style="font-family:\'Times New Roman\',serif;font-size:14px;margin:18mm">'+x+'</body>');w.document.close();w.focus();setTimeout(()=>w.print(),400)}
async function makePdf(html,name){const r=document.getElementById('pdfroot'),mask=document.getElementById('pdfmask');
 r.innerHTML=`<div style="padding:30px;font-family:'Times New Roman',serif;font-size:14px;color:#000;background:#fff">${html}</div>`;
 mask.style.display='flex';scrollTo(0,0);await new Promise(x=>setTimeout(x,200));const keep=r.innerHTML;
 try{const cv=await html2canvas(r,{scale:2,backgroundColor:'#ffffff',scrollX:0,scrollY:0,windowWidth:800,logging:false});
  const d=cv.getContext('2d').getImageData(0,0,cv.width,cv.height).data;let ink=0;for(let i=0;i<d.length;i+=52)if(d[i]<160)ink++;
  if(ink<20)throw new Error('blank');
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'pt',format:'a4'}),W=595,H=842,ph=Math.floor(cv.width*H/W);
  for(let y=0,pg=0;y<cv.height;y+=ph,pg++){const s=document.createElement('canvas');s.width=cv.width;s.height=Math.min(ph,cv.height-y);const g=s.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,s.width,s.height);g.drawImage(cv,0,y,cv.width,s.height,0,0,cv.width,s.height);
   if(pg)doc.addPage();doc.addImage(s.toDataURL('image/jpeg',0.92),'JPEG',0,0,W,s.height*W/cv.width)}
  doc.save(name)}
 catch(e){printFallback(keep)}
 finally{r.innerHTML='';mask.style.display='none'}}
function pdfOne(id){const t=db.transfers.find(x=>x.id===id),d=dev(t.deviceId);
 makePdf(`${HEAD}<h2 style="text-align:center;margin:24px 0 4px">${t.kind==='return'?'BIÊN BẢN TRẢ LẠI THIẾT BỊ':'BIÊN BẢN BÀN GIAO THIẾT BỊ'}</h2><p style="text-align:center">Số: ${t.id}</p>
 <p>Hôm nay, lúc ${fmt(t.time)}, hai bên tiến hành bàn giao thiết bị như sau:</p>
 <p><b>I. BÊN GIAO:</b> ${E(t.from)}</p><p><b>II. BÊN NHẬN:</b> ${E(t.to)}</p><p><b>III. DANH SÁCH THIẾT BỊ:</b></p>
 <table ${TBL}><tr style="font-weight:bold"><td ${TD}>STT</td><td ${TD}>Mã</td><td ${TD}>Tên thiết bị</td><td ${TD}>Số serial</td><td ${TD}>Tình trạng khi giao</td></tr><tr><td ${TD}>1</td><td ${TD}>${E(d.id)}</td><td ${TD}>${E(d.name)}</td><td ${TD}>${E(d.serial)}</td><td ${TD}>${E(t.note)||'Bình thường'}</td></tr></table>
 <p>Trạng thái: <b>${t.status}</b>${t.doneAt?' (xác nhận lúc '+fmt(t.doneAt)+')':''}. Biên bản lập thành 02 bản, mỗi bên giữ 01 bản.</p>
 <table style="width:100%;text-align:center;margin-top:20px"><tr><td><b>BÊN GIAO</b><br><i>(Ký, ghi rõ họ tên)</i><br><br><br><br>${E(t.from)}</td><td><b>BÊN NHẬN</b><br><i>(Ký, ghi rõ họ tên)</i><br><br><br><br>${t.status==='Đã hoàn tất'?'<span style="color:#047857">✔ Đã xác nhận qua mã QR'+(t.confirmBy?': '+E(t.confirmBy.name)+((t.confirmBy.phone||t.confirmBy.email)?' - '+E(t.confirmBy.phone||t.confirmBy.email):''):'')+'<br></span>':''}${E(t.to)}</td></tr></table>`,t.id+'.pdf')}
function pdfLog(){const L=ordered(jList());const sub=[jf.from&&'từ '+jf.from,jf.to&&'đến '+jf.to,jf.who&&'cá nhân: '+jf.who].filter(Boolean).join(' · ')||'Toàn bộ';
 makePdf(`${HEAD}<h2 style="text-align:center;margin:24px 0 4px">SỔ NHẬT KÝ GIAO NHẬN THIẾT BỊ</h2><p style="text-align:center">${E(sub)}</p>
 <table ${TBL}><tr style="font-weight:bold"><td ${TD}>STT</td><td ${TD}>Thời gian</td><td ${TD}>Thiết bị</td><td ${TD}>Giao</td><td ${TD}>Nhận</td><td ${TD}>Trạng thái</td></tr>${L.map((t,i)=>`<tr><td ${TD}>${i+1}</td><td ${TD}>${fmt(t.time)}</td><td ${TD}>${E(dev(t.deviceId).name)}</td><td ${TD}>${E(t.from)}</td><td ${TD}>${E(t.to)}</td><td ${TD}>${t.status}</td></tr>`).join('')}</table><p>Tổng cộng: ${L.length} phiếu.</p>`,'so-nhat-ky.pdf')}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
initData();render();
</script></body></html>
